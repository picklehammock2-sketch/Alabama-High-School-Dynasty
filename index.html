<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alabama High School Dynasty v1.4.8 — iPhone Edition</title>
<style>
body{margin:0;background:#0f1319;color:#eef2f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{background:#171d25;border-bottom:1px solid #303946;padding:24px}
main{max-width:1100px;margin:auto;padding:22px}
h1,h2,h3{margin-top:0}.muted{color:#9da8b5}.panel{background:#171d25;border:1px solid #303946;border-radius:14px;padding:20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:#202731;border:1px solid #35404e;border-radius:12px;padding:16px}
button{background:#e8edf4;color:#111;border:0;border-radius:9px;padding:11px 16px;font-weight:800;cursor:pointer}
button.secondary{background:#303b49;color:#eef2f7}
.tag{display:inline-block;background:#303b49;border-radius:999px;padding:4px 9px;font-size:12px;margin:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stat{font-size:28px;font-weight:800}.bar{height:8px;background:#303946;border-radius:99px;overflow:hidden}.fill{height:100%;background:#aebdce}
.log{border-left:3px solid #8fa4b9;padding-left:12px;margin:10px 0}
.choice{display:block;width:100%;text-align:left;margin:8px 0;background:#202731;color:#eef2f7;border:1px solid #3a4654}
.choice:hover{border-color:#aebdce}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #303946}
.weather{font-size:18px}.weather b{font-size:25px}.good{color:#b8e0c2}.warn{color:#f2d58a}

/* v1.4.6 iPhone/mobile-first pass */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#0f1319}
body{min-width:0;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
header{padding:16px 14px;position:sticky;top:0;z-index:5}
header h1{font-size:22px;line-height:1.15;margin-bottom:5px}
header .muted{font-size:12px;line-height:1.35}
main{width:100%;max-width:760px;margin:0 auto;padding:12px 12px 28px}
.panel{padding:15px;border-radius:12px;margin-bottom:12px}
.card{padding:13px;border-radius:10px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.row{gap:8px}
button,.choice{min-height:46px;padding:12px 14px;font-size:16px;touch-action:manipulation}
.choice{margin:7px 0;line-height:1.3}
input,select,textarea{font-size:16px!important;max-width:100%}
.stat{font-size:25px}
table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;font-size:14px}
td,th{padding:9px 10px}
.log{overflow-wrap:anywhere}
@media (max-width:430px){
  .grid{grid-template-columns:1fr 1fr}
  .panel h2{font-size:21px}
  .panel h3{font-size:17px}
  .weather{font-size:16px}
  .weather b{font-size:21px}
  button{width:100%;margin:4px 0}
  .row>button{width:100%}
  .row>div{width:100%}
}
@media (max-width:350px){
  main{padding-left:8px;padding-right:8px}
  .grid{grid-template-columns:1fr}
  .panel{padding:12px}
}
</style>

 if(status==='missed'){finishSeason(`Your season ended after the regular season. ${state.school.name} finished ${regionFinish(state.school.id)}th in Region ${state.school.region} and did not qualify for the ${state.school.classification} playoffs.`);return;}
 state.playoffRound=1; state.playoffSlot=state.playoffSeed; state.playoffOpponent=null;
 state.playoffOpponents=buildPlayoffPath();
 showPlayoffRound();
}
function buildPlayoffPath(){
 const cls=state.school.classification, field=state.playoffField||buildPlayoffField(), mine=field.find(t=>t.id===state.school.id);
 const others=field.filter(t=>t.id!==state.school.id);
 const rounds=cls==='6A'?5:4; const path=[]; let pool=others.slice();
 for(let round=1;round<=rounds;round++){
   if(cls==='6A'&&state.playoffSeed<=2&&round===1){path.push(null);continue;}
   const previous=path.filter(Boolean).map(x=>x.id);
   const candidates=pool.filter(t=>!previous.includes(t.id));
   let pick=null;
   if(candidates.length){
     // Favor plausible bracket opponents: adjacent seed/region first, but never reuse an opponent.
     const ranked=candidates.slice().sort((a,b)=>{
       const da=Math.abs((a.regionSeed||4)-(mine?.regionSeed||4))+Math.abs(Number(a.region)-Number(mine?.region));
       const db=Math.abs((b.regionSeed||4)-(mine?.regionSeed||4))+Math.abs(Number(b.region)-Number(mine?.region));
       return da-db || ((b.wins||0)-(a.wins||0));
     });
     const top=ranked.slice(0,Math.min(4,ranked.length)); pick=top[Math.floor(Math.random()*top.length)];
   }
   path.push(pick);
 }
 return path;
}
function playoffOpponent(){
 const cls=state.school.classification, round=state.playoffRound||1;
 if(cls==='6A'&&state.playoffSeed<=2&&round===1)return `First-round bye — Region ${state.school.region} #${state.playoffSeed}`;
 const opp=state.playoffOpponents?.[round-1];
 return opp?.name||'Playoff Opponent';
}

function playoffGame(){

 if(cls==='6A'&&state.playoffSeed<=2&&state.playoffRound===1){state.playoffRound=2;showPlayoffRound();return;}
 const roundNames=cls==='6A'?['First Round','Second Round','Quarterfinal','Semifinal','State Championship']:['First Round','Quarterfinal','Semifinal','State Championship'];
 const round=state.playoffRound;
 const roundName=roundNames[round-1]||'Playoff Round';
 const oppName=playoffOpponent();
 let oppSchool=DATA.schools.find(s=>s.name===oppName);
 let opp=oppSchool?matchupPower(oppSchool,[]):70+Math.random()*20;
 let starters=state.players.filter(p=>p.starter&&!p.injury);
 let avg=starters.reduce((a,x)=>a+x.ability,0)/(starters.length||1);
 let gap=(avg+state.school.strength*.35)-(opp+70*.35);
 let score=scoreFor(clamp(21+gap*.7,5,68),.6),oscore=scoreFor(clamp(21-gap*.62,4,62),.6);
 if(score===oscore)score++;
 const win=score>oscore;
 const halftimeA=Math.min(score,Math.max(0,Math.round(score*.32)));

 }else{

 }

function promotionOutcome(p){
 const roll=Math.random();
 const confidence=p.confidence ?? Math.floor(Math.random()*50);
 p.confidence=confidence;
 if(roll<0.22){
   p.varsityReaction="He was nervous about varsity competition and admitted the speed of the game was intimidating.";
   p.varsityReady=false;
 } else if(roll<0.40){
   p.varsityReaction="He was thrilled by the promotion and immediately asked for more reps.";
   p.varsityReady=true;
 } else if(roll<0.58){
   p.varsityReaction="He was quiet at first, worried he wasn't ready, but said he wanted the challenge.";
   p.varsityReady=true;
 } else if(roll<0.75){
   p.varsityReaction="He took the promotion personally—in a good way—and showed up to practice with something to prove.";
   p.varsityReady=true;
 } else {
   p.varsityReaction="He was surprised by the promotion but handled it like a veteran and embraced the opportunity.";
   p.varsityReady=true;
 }
 p.promotedWeek=state.week;
 // The first varsity appearance gets an immediate consequence.
 let performanceRoll=Math.random();
 if(!p.varsityReady){
   if(performanceRoll<0.55){
     p.promoResult="He struggled with the speed of varsity football and looked overwhelmed.";
     p.promoDelta=-2;
   } else {
     p.promoResult="The nerves faded quickly and he made a few solid plays.";
     p.promoDelta=1;
   }
 } else if(performanceRoll<0.18){
   p.promoResult="He absolutely balled out and immediately looked like he belonged on Friday nights.";
   p.promoDelta=4;
 } else if(performanceRoll<0.45){
   p.promoResult="He held his own and gave the staff enough to justify the promotion.";
   p.promoDelta=2;
 } else if(performanceRoll<0.72){
   p.promoResult="He was mostly quiet, but didn't hurt the team. The staff will need more evidence.";
   p.promoDelta=0;
 } else if(performanceRoll<0.9){
   p.promoResult="He struggled badly against varsity speed, making the promotion look premature.";
   p.promoDelta=-2;
 } else {
   p.promoResult="He made a costly mistake that had the coaching staff questioning the timing of the promotion.";
   p.promoDelta=-4;

 p.ability=clamp(p.ability+(p.promoDelta>0?1:0),40,p.potential);
 state.lastPromotion=p;
}
function monday(){

function promote(name){

 state.log.unshift(`${name} promoted to varsity after a strong JV performance.`);

function keep(name){
 let p=state.players.find(x=>x.name===name);
 if(p){
  let r=Math.random();
  if(r<0.25){
   p.jvReaction="He was disappointed to stay on JV and told the staff he believes he's ready for varsity.";
   p.morale=(p.morale||50)-5;
  } else if(r<0.5){
   p.jvReaction="He accepted the decision and said he wants to keep improving.";
   p.morale=(p.morale||50)+2;
  } else if(r<0.75){
   p.jvReaction="He was relieved. He admitted he isn't sure he's ready for varsity yet.";
   p.morale=(p.morale||50)+4;
  } else {
   p.jvReaction="He took the decision as motivation and responded with an even better week of practice.";
   p.morale=(p.morale||50)+6;
   p.ability=Math.min(p.potential,p.ability+1);
  }
  state.log.unshift(`${name} stayed on JV. ${p.jvReaction}`);
  render(`<div class="panel"><div class="muted">PLAYER DEVELOPMENT DECISION</div><h2>${p.name} remains on JV</h2>
   <div class="card"><h3>Player reaction</h3><p>${p.jvReaction}</p></div>
   <p class="muted">Keeping a player down can preserve confidence—or frustrate a player who believes he's ready.</p>
   <button onclick="advance()">Continue to next week</button></div>`);

function advance(){

 // Regular season uses 10 games across 11 playing dates. OPEN is a real bye,
 // not an opponent and not a win/loss. Playoffs begin after Week 11.

}

function randomWorldRecord(){
  const r=Math.random();
  let wins;
  if(r<0.01) wins=10;
  else if(r<0.05) wins=9;
  else if(r<0.14) wins=8;
  else if(r<0.30) wins=7;
  else if(r<0.52) wins=6;
  else if(r<0.75) wins=5;
  else if(r<0.89) wins=4;
  else if(r<0.96) wins=3;
  else if(r<0.99) wins=2;
  else wins=1;
  const losses=10-wins;
  return {wins,losses};
}
function seedWorldStandings(){
  state.worldStandings=state.worldStandings||{};
  DATA.schools.forEach(s=>{
    if(state.worldStandings[s.id]) return;
    const rec=randomWorldRecord();
    const regionGames=Math.min(7,Math.max(4,Math.round(4+Math.random()*3)));
    const rw=Math.min(regionGames,Math.max(0,Math.round(rec.wins*(regionGames/10)+(Math.random()*3-1))));
    state.worldStandings[s.id]={id:s.id,name:s.name,classification:s.classification,region:s.region,wins:rec.wins,losses:rec.losses,regionWins:rw,regionLosses:regionGames-rw,pointsFor:Math.max(80,rec.wins*28+Math.round(Math.random()*90)),pointsAgainst:Math.max(80,rec.losses*25+Math.round(Math.random()*90))};
  });
}
function ensureWorldStandings(){
  state.worldStandings=state.worldStandings||{};
  seedWorldStandings();
  DATA.schools.forEach(s=>{if(!state.worldStandings[s.id]){const rec=randomWorldRecord();state.worldStandings[s.id]={id:s.id,name:s.name,classification:s.classification,region:s.region,wins:rec.wins,losses:rec.losses,regionWins:0,regionLosses:0,pointsFor:0,pointsAgainst:0};}});
  if(state.school&&state.record){
    const me=state.worldStandings[state.school.id]||{};
    me.wins=state.record[0]; me.losses=state.record[1]; me.regionWins=state.regionWins||0; me.regionLosses=state.regionLosses||0;
    state.worldStandings[state.school.id]=me;
  }
}
function regionFinish(schoolId){
  ensureWorldStandings();
  const school=DATA.schools.find(s=>s.id===schoolId); if(!school)return null;
  const rows=DATA.schools.filter(s=>s.classification===school.classification&&String(s.region)===String(school.region)).map(s=>{const w=state.worldStandings[s.id]||{};return {...s,wins:w.wins||0,losses:w.losses||0,regionWins:w.regionWins||0,regionLosses:w.regionLosses||0,pointsFor:w.pointsFor||0,pointsAgainst:w.pointsAgainst||0};}).sort((a,b)=>{const ap=(a.regionWins||0)/Math.max(1,(a.regionWins||0)+(a.regionLosses||0)),bp=(b.regionWins||0)/Math.max(1,(b.regionWins||0)+(b.regionLosses||0));return (bp-ap)||((b.wins||0)-(a.wins||0))||((b.pointsFor||0)-(a.pointsFor||0));});
  const idx=rows.findIndex(r=>r.id===schoolId); return idx<0?null:idx+1;
}
function generateGameStats(score,oscore,weather,matchup){
  state.players.forEach(initPlayerStats);
  const {qb,rb,wrs,lbs,dls,dbs}=seasonStatLine();
  const tes=state.players.filter(p=>p.starter&&!p.injury&&p.pos==='TE');
  const starters=state.players.filter(p=>p.starter&&!p.injury);
  const backups=state.players.filter(p=>!p.starter&&!p.injury);
  const blowout=Math.abs(score-oscore)>=21;
  const runGame=(weather.field==='muddy'||weather.run>3);
  const passY=Math.max(40,Math.round(score*6.0+(Math.random()*100-50)-(runGame?70:0)));
  const rushY=Math.max(20,Math.round(score*6.7+(Math.random()*110-55)+(runGame?80:0)));
  if(qb){let att=Math.max(4,Math.round(passY/(9+Math.random()*4)+Math.random()*5));let cmp=Math.min(att,Math.max(1,Math.round(att*(0.52+(qb.ability-55)/170)+normalish()*2)));addStat(qb,'games',1);addStat(qb,'passAtt',att);addStat(qb,'passCmp',cmp);addStat(qb,'passYds',passY);addStat(qb,'passTD',Math.max(0,Math.round(score/17+(Math.random()<.35?1:0)-(runGame?0.3:0))));addStat(qb,'ints',Math.random()<Math.min(.28,.04+weather.fumble*.012)?1:0);let ra=Math.max(0,Math.round(score/12+Math.random()*7));let ry=Math.max(0,Math.round(ra*(qb.ability/12)*(0.7+Math.random()*.45)));addStat(qb,'rushAtt',ra);addStat(qb,'rushYds',ry);if(Math.random()<.35)addStat(qb,'rushTD',1);}
  if(rb){addStat(rb,'games',1);let carries=Math.max(3,Math.round(rushY/5.7));if(blowout && score>oscore) carries=Math.round(carries*.85);addStat(rb,'rushAtt',carries);addStat(rb,'rushYds',rushY);let td=Math.max(0,Math.round(score/20+(runGame?0.4:0)+(Math.random()<.25?1:0)));addStat(rb,'rushTD',td);rb.stats.longRush=Math.max(rb.stats.longRush,Math.max(8,Math.round(rushY/Math.max(1,carries)* (1.5+Math.random()*2))));rb.careerStats.longRush=rb.stats.longRush;}
  const targets=Math.max(2,Math.round((qb?.stats.passAtt||12)*.9));
  [...wrs,...tes].forEach((w,i)=>{addStat(w,'games',1);let t=Math.max(1,Math.round(targets/Math.max(1,wrs.length)*(0.8+Math.random()*.5)));let rec=Math.min(t,Math.max(0,Math.round(t*(.55+Math.random()*.25))));let ry=Math.max(0,Math.round(passY*(rec/Math.max(1,(qb?.stats.passCmp||rec)))*(0.75+Math.random()*.55)));addStat(w,'targets',t);addStat(w,'receptions',rec);addStat(w,'recYds',ry);if(rec>0&&Math.random()<Math.min(.55,score/70))addStat(w,'recTD',1);w.stats.longRec=Math.max(w.stats.longRec,Math.max(8,Math.round(ry/Math.max(1,rec)*(1.5+Math.random()*2))));w.careerStats.longRec=w.stats.longRec;});
  [...lbs,...dls,...dbs].forEach((d,i)=>{addStat(d,'games',1);addStat(d,'tackles',Math.max(1,Math.round(3+Math.random()*6+(oscore>score?1:0))));if(d.pos==='DL'&&Math.random()<.45)addStat(d,'tfl',1);if(d.pos==='DL'&&Math.random()<.22)addStat(d,'sacks',1);if(d.pos==='DB'&&Math.random()<.08)addStat(d,'intsDef',1);if(d.pos==='DB'&&Math.random()<.25)addStat(d,'pbu',1);});
  // Blowouts create backup opportunities; starters lose some volume when the lead is huge.

function commonFootballScore(raw, finalScore){
  raw=Number(raw)||0; finalScore=Math.max(0,Number(finalScore)||0);
  if(finalScore<=0)return 0;
  const candidates=[0,3,6,7,8,9,10,12,13,14,15,16,17,20,21,24,27,28,30,31,34,35,38,40,41,42,45,48,49,52,56,59,60,63,66,70,77];
  const allowed=candidates.filter(v=>v<=finalScore);
  if(!allowed.length)return 0;
  return allowed.reduce((best,v)=>Math.abs(v-raw)<Math.abs(best-raw)?v:best,allowed[0]);
}
function safeHalftimeScore(finalScore){
  finalScore=Math.max(0,Number(finalScore)||0);
  if(finalScore<=3) return finalScore;
  // Halftime is a real checkpoint, not an independent random score.
  // Prevent absurd second-half explosions such as 16-0 -> 79-0.
  // Normal games reach roughly 38-58% of a team's final points by halftime.
  let frac=0.38+Math.random()*0.20;
  // Rare slow starts are allowed, but only when the final score is modest.
  if(finalScore<=35 && Math.random()<0.08) frac=0.24+Math.random()*0.10;
  // For very high final totals, require enough points at halftime that the
  // second half remains within a plausible high-school scoring range.
  if(finalScore>=56){
    const minSecondHalf=21;
    const maxSecondHalf=42;
    const minHalftime=Math.max(0,finalScore-maxSecondHalf);
    const maxHalftime=Math.min(finalScore,finalScore-minSecondHalf);
    let target=finalScore*frac;
    target=Math.max(minHalftime,Math.min(maxHalftime,target));
    return commonFootballScore(target,finalScore);
  }
  return Math.min(commonFootballScore(finalScore*frac,finalScore),finalScore);
}

  if(s.id==='r-c-hatch') evidence=Math.min(18,Math.max(10,evidence));
  // Store the calculated value so the rest of the engine sees the same rating,
  // but never collapse it to an integer.
  s.strength=Math.round(clamp100(evidence)*10)/10;
  return s.strength;
}
refreshSchoolStrength=refreshSchoolStrength_v149;
// Re-render the chooser with the same decimal precision used by the engine.
// v1.4.13: DEFINITIVE HARD-CODED SCHOOL RATINGS.
// The chooser reads the hard-coded value directly. It does NOT call any
// recalculation function, and it does NOT round the rating.
choose=function(){
 const q=(document.getElementById('schoolSearch')?.value||'').trim().toLowerCase();
 const cls=document.getElementById('classFilter')?.value||'ALL';
 const list=DATA.schools.filter(s=>(cls==='ALL'||s.classification===cls)&&(!q||s.name.toLowerCase().includes(q)))
   .sort((a,b)=>a.classification.localeCompare(b.classification)||a.region-b.region||a.name.localeCompare(b.name));
 render(`<div class="panel"><div class="row"><div><h2>Choose Your School</h2><span class="muted">2026 football database • ${DATA.schools.length} participating schools</span></div><button class="secondary" onclick="home()">Back</button></div>
 <div class="grid" style="margin-top:14px"><input id="schoolSearch" placeholder="Search school..." value="${q.replace(/"/g,'&quot;')}" style="padding:12px;border-radius:8px;border:1px solid #3a4654;background:#11161d;color:#eef2f7;font-size:16px"><select id="classFilter" style="padding:12px;border-radius:8px;border:1px solid #3a4654;background:#11161d;color:#eef2f7;font-size:16px"><option value="ALL">All classifications</option>${['1A','2A','3A','4A','5A','6A','Single-A','Double-A'].map(c=>`<option value="${c}" ${cls===c?'selected':''}>${c}</option>`).join('')}</select></div></div>
 <div id="schoolList" class="grid">${list.map(s=>`<div class="card school-card" data-school-name="${s.name.toLowerCase().replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" data-class="${s.classification}"><h3>${s.name}</h3><span class="tag">${s.classification}</span><span class="tag">Region ${s.region}</span>${s.enrollment?`<span class="tag">${displayRating(s.enrollment)} students</span>`:''}<p>Overall: ${displayRating(hardRating(s)).toFixed(1)}/100 • 2025: ${s.record2025||'—'} • Historical power: ${Number(s.program_dna?.historical_power??s.strength??0).toFixed(1)}/100 • Recent performance: ${recentCalibration(s)!=null?Number(recentCalibration(s)).toFixed(1)+'%':'—'}</p><p class="muted">Hard-coded preseason rating • ${(s.region_opponents||[]).length} region opponents in database</p><button onclick="setupCoach('${s.id}')">Coach Here</button></div>`).join('')}</div>`);
 const searchInput=document.getElementById('schoolSearch');
 const classSelect=document.getElementById('classFilter');
 const cards=Array.from(document.querySelectorAll('.school-card'));
 const filterCards=()=>{
   const text=searchInput.value.trim().toLowerCase();
   const selected=classSelect.value;
   cards.forEach(card=>{
     const matchName=!text||card.dataset.schoolName.includes(text);
     const matchClass=selected==='ALL'||card.dataset.class===selected;
     card.style.display=(matchName&&matchClass)?'':'none';
   });
 };
 searchInput.addEventListener('input',filterCards);
 classSelect.addEventListener('change',filterCards);
}

// v1.4.13 HARD-CODED RATING LOCK: every one of the 394 playable schools has a
// decimal-capable preseason rating. This prevents legacy strength:60 placeholders
// from ever reaching the school chooser or engine. Season performance can still
// modify the live rating through refreshSchoolStrength_v149.
DATA.schools.forEach(s=>{ s.strength=hardRating(s); });

// v1.4.8 launch fix: the previous package defined home() but never invoked it.
// Start the game only after every function/patch above has been defined.
try { home(); } catch (err) {
  const app = document.getElementById("app");
  if (app) app.innerHTML = `<div class="panel"><h2>Game startup error</h2><p class="warn">The game could not finish loading.</p><p class="muted">${String(err && err.message ? err.message : err)}</p><button onclick="location.reload()">Reload Game</button></div>`;
  console.error(err);
}

/* v1.4.24 CONSOLIDATION: richer transfer stories, toxic superstar QB, position development and college interest. */
(function(){
  const _oldTransferCandidate = transferCandidate;
  const _oldLockerCard = lockerCard;
  const _oldCultureEvent = cultureEvent;
  const _oldPractice = practice;
  const _oldStartNextSeason = startNextSeason;
  const _oldAdvance = advance;

  function transferReasonPack(){
    const r=Math.random();
    if(r<0.22)return {key:'family_move',title:'Family Relocation',story:'His family recently moved into your school zone because of a job relocation. He did not leave his old program because of football — he had to change schools.',talent:'elite',risk:'low'};
    if(r<0.38)return {key:'locker_room',title:'Locker-Room Problems',story:'His previous program reports repeated locker-room conflicts. The talent is real, but the transition comes with baggage.',talent:'high',risk:'high'};
    if(r<0.52)return {key:'academic',title:'Academic Fresh Start',story:'He transferred after academic and eligibility problems at his previous school. He wants a clean start, but the classroom comes first.',talent:'high',risk:'medium'};
    if(r<0.65)return {key:'coach_conflict',title:'Previous Coach Conflict',story:'He and his former coaching staff stopped seeing eye to eye. He believes he was not being developed properly.',talent:'high',risk:'medium'};
    if(r<0.77)return {key:'playing_time',title:'Playing-Time Dispute',story:'He left after losing a quarterback competition at his former school. He wants another chance to prove he can start.',talent:'medium',risk:'medium'};
    if(r<0.88)return {key:'program_collapse',title:'Program Trouble',story:'His former program has fallen into turmoil after staff turnover and a rough season. He is looking for stability.',talent:'high',risk:'low'};
    return {key:'position_change',title:'Athlete Looking for a Role',story:'He arrives listed as a quarterback, but your staff immediately notices unusual speed, size and athletic ability that could translate to another position.',talent:'medium',risk:'low'};
  }

  transferCandidate=function(){
    const reason=transferReasonPack();
    let ability=60+Math.floor(Math.random()*17), potential=72+Math.floor(Math.random()*20), exp=58+Math.floor(Math.random()*30);
    if(reason.talent==='elite'){ability=88+Math.floor(Math.random()*9);potential=96+Math.floor(Math.random()*4);exp=72+Math.floor(Math.random()*20);}
    if(reason.key==='academic'){ability=72+Math.floor(Math.random()*13);potential=82+Math.floor(Math.random()*16);}
    if(reason.key==='position_change'){ability=65+Math.floor(Math.random()*11);potential=78+Math.floor(Math.random()*18);}
    if(reason.key==='locker_room'){ability=78+Math.floor(Math.random()*16);potential=86+Math.floor(Math.random()*13);}
    const p={name:uniqueName(),grade:10+Math.floor(Math.random()*2),pos:'QB',ability,potential,exp,starter:false,injury:null,morale:68,transfer:true,transferOriginClass:'6A',personality:reason.key==='locker_room'?'volatile':reason.key==='academic'?'driven':reason.key==='family_move'?'steady':['competitive','confident','fiery'][Math.floor(Math.random()*3)],transferReason:reason.key,transferReasonTitle:reason.title,transferStory:reason.story,transferRisk:reason.risk,altPosition:null,positionPlan:null,eligibility:reason.key==='academic'?'Eligibility pending':'Eligible',collegeInterest:[],recruitingNarrative:reason.key==='family_move'?'Family relocation made the transfer possible.':''};
    if(reason.key==='position_change') p.altPosition=Math.random()<0.55?'WR':'RB';
    if(reason.key==='family_move') p.transferFamilyMove=true;
    if(reason.key==='academic') p.academicRisk=1;
    if(reason.key==='locker_room') p.cultureRisk=1;
    initPlayerStats(p); return p;
  };

  function transferPositionFit(p,pos){
    if(!p)return 0;
    const athletic=(p.speed||70)+(p.athleticism||70);
    const bonus=pos==='WR'?((p.speed||70)*0.12+(p.potential||70)*0.05):((p.athleticism||70)*0.12+(p.potential||70)*0.05);
    return Math.round(clamp((p.ability*.45)+(p.potential*.25)+bonus+Math.random()*8,35,96));
  }
  function moveTransferPosition(p,pos){
    p.pos=pos;p.starter=false;p.altPosition=pos;p.positionPlan={from:'QB',to:pos,weeks:0};
    const fit=transferPositionFit(p,pos); p.ability=Math.max(p.ability,Math.min(p.potential,fit));
    p.potential=Math.min(99,p.potential+3);p.morale=clamp((p.morale||70)+2,0,100);
    return fit;
  }

  resolveTransferQB=function(choice){
    const t=state.pendingTransferQB,z=state.players.find(p=>p.pos==='QB'); if(!t)return dashboard();
    state.pendingTransferQB=null;state.pendingLockerEvent=null;
    let outcome='Positive',result='',next='';
    const reason=t.transferReasonTitle||'Transfer';
    if(choice==='zionMove' && z){
      const newPos=Math.random()<0.55?'WR':'RB';z.pos=newPos;z.starter=false;t.starter=true;
      result=`You asked ${z.name} to move from quarterback to ${newPos}. ${t.name} gets the QB job.`;
      next=`${z.name} can embrace the new role or resent losing the position. His development at ${newPos} will now matter.`;
      z.morale-=8;t.morale+=5;state.teamCulture.chemistry-=2;
    } else if(choice==='transferMove'){
      const newPos=t.altPosition||((t.potential>=88&&Math.random()<0.6)?'WR':'RB');
      const fit=moveTransferPosition(t,newPos);
      result=`You decided ${t.name} is not your best QB option and moved him to ${newPos}. His early fit is about ${fit} overall, with room to grow.`;
      next=`If he embraces the move, his athletic traits could make him much better at ${newPos} than he ever was at quarterback.`;
      t.morale-=3;state.teamCulture.trust+=2;
    } else if(choice==='battle'){
      const winner=Math.random()<clamp(.50+(t.exp-(z?.exp||55))*.003+(t.ability-(z?.ability||55))*.01,.25,.75)?t:z;
      winner.starter=true;if(winner===t&&z)z.starter=false;
      result=`The QB battle was intense. ${winner.name} won the job after competing through practice.`;
      next=winner===t?`${z?.name||'The returning quarterback'} now has to decide whether to accept the challenge or look elsewhere.`:`${t.name} was told he must earn another opportunity while ${z?.name||'the returning quarterback'} keeps QB1.`;
      if(z)z.morale-=4;t.morale+=winner===t?5:-4;state.teamCulture.chemistry=Math.max(0,state.teamCulture.chemistry-1);
    } else if(choice==='zion'){
      if(z)z.starter=true;t.starter=false;t.morale-=5;
      result=`You kept ${z?.name||'the returning quarterback'} as QB1 and told ${t.name} that 6A experience does not guarantee a starting job here.`;
      next=`${t.name} can respond by working harder, accepting the role, asking for a position change, or eventually deciding he wants to leave.`;
    } else {
      t.starter=false;t.eligibility='Eligibility pending';
      const leave=Math.random()<0.28;
      if(leave){outcome='Negative';t.morale-=18;t.transferExit=true;result=`You held ${t.name} out while eligibility is reviewed. He believes you are using eligibility as an excuse and is considering leaving.`;next=`He may transfer again and publicly criticize how the program handled his arrival.`;}
      else{t.morale+=3;result=`You held ${t.name} out while eligibility is reviewed. He accepts the decision and begins learning the system.`;next=`He spends the year learning the offense and could enter next season prepared to take the job.`;}
    }
    if(t.transferReason==='family_move' && t.ability>=88 && choice==='zion') next+=` His family moved here, so losing a player of this caliber could become one of the biggest missed opportunities in your tenure.`;
    if(t.transferReason==='position_change' && choice==='transferMove') next+=` The staff believes ${t.name} could eventually attract college interest at ${t.pos}.`;
    if(t.transferReason==='academic') next+=' His academic standing will remain part of his eligibility profile.';
    if(t.transferReason==='locker_room') next+=' His reputation means the locker room will be watching how you handle him.';
    if(t.transferExit){state.log.unshift(`${t.name} left after the eligibility dispute.`);} else if(!state.players.includes(t)) state.players.push(t);
    ensureCulture();state.teamCulture.morale=clamp(state.teamCulture.morale+(outcome==='Negative'?-4:2),0,100);state.teamCulture.chemistry=clamp(state.teamCulture.chemistry,0,100);
    state.log.unshift(`Transfer QB decision: ${reason} / ${choice}. ${result}`);
    render(`<div class="panel"><div class="muted">DECISION OUTCOME</div><h2>QB Transfer — ${outcome}</h2><div class="card"><h3>Why He Transferred</h3><p><b>${reason}</b></p><p>${t.transferStory||'The transfer is seeking a new football opportunity.'}</p></div><div class="card"><h3>Outcome</h3><p>${result}</p></div><div class="card"><h3>Consequences</h3><p><b>Team Morale:</b> ${Math.round(state.teamCulture.morale)}/100 • <b>Chemistry:</b> ${Math.round(state.teamCulture.chemistry)}/100</p></div><div class="card"><h3>What Happens Next</h3><p>${next}</p></div><button onclick="practice()">Continue</button></div>`);
  };

  showTransferQB=function(){
    const t=state.pendingTransferQB,z=state.players.find(p=>p.pos==='QB'); if(!t)return dashboard();
    const zion=z||{name:'your returning QB',grade:11,ability:55,exp:55,morale:70};
    const risk=t.transferRisk==='high'?'High':t.transferRisk==='medium'?'Medium':'Low';
    render(`<div class="panel"><div class="muted">PRESEASON TRANSFER / QB ROOM</div><h2>${state.school.name} has a quarterback decision.</h2><div class="card"><h3>Why did he transfer?</h3><p><b>${t.transferReasonTitle||'Transfer'}</b></p><p>${t.transferStory||''}</p><p><b>Locker-room risk:</b> ${risk}</p></div><div class="card"><p><b>${zion.name}</b> is returning at quarterback.</p><p><b>${t.name}</b> arrives from a <b>6A program</b>.</p><p>QB • Grade ${t.grade} • Ability ${t.ability} • Potential ${t.potential} • Experience ${t.exp}</p><p>Eligibility: <b>${t.eligibility||'Eligible'}</b></p></div><div class="grid"><button class="choice" onclick="resolveTransferQB('zionMove')">Ask ${zion.name} to move positions</button><button class="choice" onclick="resolveTransferQB('transferMove')">Move the transfer to WR/RB</button><button class="choice" onclick="resolveTransferQB('battle')">Hold a true QB battle</button><button class="choice" onclick="resolveTransferQB('zion')">Stick with ${zion.name}; make the transfer earn it</button><button class="choice" onclick="resolveTransferQB('sit')">Hold the transfer out while eligibility is reviewed</button></div></div>`);
  };

  // Only generate the special QB transfer at the season boundary or before Week 1.
  cultureEvent=function(){
    ensureCulture();
    if(state.pendingDiscovery||state.pendingTransferQB)return null;
    if(state.week===1 && !state.transferQBHandled && Math.random()<0.12){
      state.pendingTransferQB=transferCandidate();state.transferQBHandled=true;state.pendingLockerEvent={type:'transferQB'};state.situationCooldownUntil=state.week+4+Math.floor(Math.random()*3);return {type:'transferQB'};
    }
    // Prevent the legacy v1.4.2 transfer generator from creating midseason transfers.
    const oldHandled=state.transferQBHandled;
    if(state.week!==1)state.transferQBHandled=true;
    const ev=_oldCultureEvent();
    state.transferQBHandled=oldHandled || state.transferQBHandled;
    return ev;
  };

  lockerCard=function(){
    const e=state.pendingLockerEvent;
    if(e?.type==='toxicQB')return `<div class="card warn"><h3>☣️ Toxic Superstar QB</h3><p><b>${e.p.name}</b> is one of the most talented players on your roster — and your locker room is miserable around him.</p><p>Teammates say he blames receivers, berates linemen and treats every mistake like somebody else's fault. You are starting to hate coaching him.</p><p><b>${e.p.pos} • Grade ${e.p.grade} • Ability ${e.p.ability} • Potential ${e.p.potential}</b></p><button class="choice" onclick="resolveToxicQB('keep')">Keep him as QB1 and live with it</button><button class="choice" onclick="resolveToxicQB('confront')">Confront him and demand a change</button><button class="choice" onclick="resolveToxicQB('bench')">Bench him and put culture first</button></div>`;
    return _oldLockerCard();
  };

  resolveToxicQB=function(choice){
    const e=state.pendingLockerEvent,p=e?.p;if(!p)return practice();
    let outcome='Mixed',result='',next='';
    if(choice==='keep'){
      state.teamCulture.morale=clamp(state.teamCulture.morale-8,0,100);state.teamCulture.chemistry=clamp(state.teamCulture.chemistry-9,0,100);state.teamCulture.trust=clamp(state.teamCulture.trust-5,0,100);p.morale=clamp((p.morale||70)+3,0,100);result=`You kept ${p.name} at QB. The team knows you're prioritizing an elite talent, but the locker room takes another hit.`;next=`If the behavior continues, teammates may stop having fun, younger players may disengage, and you may eventually have to choose between the superstar and the culture.`;
    } else if(choice==='confront'){
      const success=Math.random()<0.52;
      if(success){outcome='Positive';state.teamCulture.morale=clamp(state.teamCulture.morale+8,0,100);state.teamCulture.chemistry=clamp(state.teamCulture.chemistry+7,0,100);state.teamCulture.trust=clamp(state.teamCulture.trust+5,0,100);p.morale=clamp((p.morale||70)+5,0,100);result=`You confronted ${p.name}. To your surprise, he listened. He starts treating teammates like teammates instead of employees.`;next=`The talent remains elite, but now the team can actually enjoy playing with him.`;}else{outcome='Negative';state.teamCulture.morale=clamp(state.teamCulture.morale-4,0,100);state.teamCulture.trust=clamp(state.teamCulture.trust-7,0,100);p.morale=clamp((p.morale||70)-12,0,100);result=`${p.name} took the confrontation personally. He is still your best quarterback, but now the conflict is between the star player and his head coach.`;next=`He may demand a transfer, stop buying into the program, or force you to decide whether his talent is worth the cost.`;}
    } else {
      p.starter=false;const backup=state.players.find(x=>x!==p&&x.pos==='QB'&&!x.injury);if(backup)backup.starter=true;state.teamCulture.morale=clamp(state.teamCulture.morale+10,0,100);state.teamCulture.chemistry=clamp(state.teamCulture.chemistry+9,0,100);state.teamCulture.trust=clamp(state.teamCulture.trust+6,0,100);p.morale=clamp((p.morale||70)-14,0,100);outcome='Positive';result=`You benched ${p.name}. The football team immediately feels lighter and more connected.`;next=backup?`${backup.name} takes the reps at QB. The offense may lose some talent, but the new environment gives everyone a chance to breathe.`:`You do not have a ready-made replacement. The team culture improves, but now you have a quarterback problem.`;
    }
    state.pendingLockerEvent=null;state.log.unshift(`Toxic superstar QB decision: ${choice}. ${result}`);
    render(`<div class="panel"><div class="muted">DECISION OUTCOME</div><h2>Toxic Superstar QB — ${outcome}</h2><div class="card"><h3>Outcome</h3><p>${result}</p></div><div class="card"><h3>Consequences</h3><p><b>Morale:</b> ${Math.round(state.teamCulture.morale)}/100 • <b>Chemistry:</b> ${Math.round(state.teamCulture.chemistry)}/100 • <b>Coach Trust:</b> ${Math.round(state.teamCulture.trust)}/100</p></div><div class="card"><h3>What Happens Next</h3><p>${next}</p></div><button onclick="practice()">Continue</button></div>`);
  };

  // Rare toxic-superstar event. It only appears when an elite QB exists and the locker room is already showing strain.
  cultureEvent=function(){
    const ev=_oldCultureEvent();
    if(ev)return ev;
    if(state.week>=1 && !state.pendingLockerEvent){
      const qbs=state.players.filter(p=>p.pos==='QB'&&!p.injury&&p.ability>=84);
      if(qbs.length && (state.teamCulture?.morale||70)<68 && Math.random()<0.10){
        const p=qbs[Math.floor(Math.random()*qbs.length)];state.pendingLockerEvent={type:'toxicQB',p};state.situationCooldownUntil=state.week+4+Math.floor(Math.random()*3);return state.pendingLockerEvent;
      }
    }
    return null;
  };

  // Development for players moved out of QB, plus fictional college-interest outcomes.
  function updateCollegeInterest(){
    if(!state.players)return;
    state.players.forEach(p=>{
      p.collegeInterest=p.collegeInterest||[];
      if(p.grade>=12 && !p.collegeInterest.includes('Alabama State') && p.ability>=78 && Math.random()<0.18){
        p.collegeInterest.push('Alabama State');
        state.log.unshift(`College interest: Alabama State has contacted ${p.name}, a ${p.pos}.`);
      }
      if(p.positionPlan){
        p.positionPlan.weeks=(p.positionPlan.weeks||0)+1;
        const gain=p.positionPlan.weeks<=3?1:Math.random()<0.45?1:0;
        if(gain && p.ability<p.potential)p.ability=Math.min(p.potential,p.ability+gain);
        if(p.positionPlan.weeks===4){state.log.unshift(`${p.name} is starting to look natural at ${p.pos} after the position change.`);}
      }
    });
  }
  advance=function(){
    const before=state.week;_oldAdvance();
    if(state.week!==before)updateCollegeInterest();
  };

  startNextSeason=function(id){
    _oldStartNextSeason(id);state.transferQBHandled=false;state.pendingTransferQB=null;state.pendingLockerEvent=null;state.pendingDiscovery=null;state.log.unshift('Preseason roster note: transfer decisions are closed once Week 1 begins.');
  };

  // Ensure a fresh dynasty start has the transfer flags needed by the new system.
  const _oldStart=start;
  start=function(id){_oldStart(id);state.transferQBHandled=false;state.pendingTransferQB=null;state.pendingLockerEvent=null;};
})();

</script>
